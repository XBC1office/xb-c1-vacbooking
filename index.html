<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองวันลาพักร้อน XB-C1 Inbound</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex items-center justify-center">

    <!-- Password Modal / Lock Screen -->
    <div id="lock-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center space-y-6 border border-slate-200">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800">กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบ</h2>
                <p class="text-xs text-slate-500 mt-1">ระบบจองวันลาพักร้อน XB-C1 Inbound</p>
            </div>
            <form onsubmit="checkPassword(event)" class="space-y-4">
                <input type="password" id="passcode-input" required maxlength="4" class="w-full text-center tracking-widest text-2xl px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl text-sm shadow transition duration-200">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- Main Application (Hidden by default until password matches) -->
    <div id="main-app" class="container mx-auto p-4 max-w-6xl space-y-6 hidden w-full">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center border border-slate-200 gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-calendar-check text-indigo-600 mr-2"></i> ระบบจองวันลาพักร้อน XB-C1 Inbound
                </h1>
                <p class="text-xs text-slate-500 mt-1">จัดการและตรวจสอบโควต้าการลา (กะเช้า / กะเย็น จำกัด 3 คน/วัน)</p>
            </div>
            <button onclick="loadBookings()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> รีเฟรชข้อมูล
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Booking Form -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 h-fit">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
                    <i class="fa-solid fa-calendar-plus text-indigo-600 mr-2"></i>ฟอร์มจองวันลา
                </h2>
                <form id="booking-form" onsubmit="handleBooking(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ID พนักงาน</label>
                        <input type="text" id="emp-id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="เช่น 12345">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อ</label>
                        <input type="text" id="emp-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="ระบุชื่อจริง">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">เลือกกะการทำงาน</label>
                        <select id="emp-shift" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="">-- เลือกกะ --</option>
                            <option value="กะเช้า">กะเช้า (Morning)</option>
                            <option value="กะบ่าย">กะบ่าย (Evening)</option>
                            <option value="กะดึก">กะดึก (Night)</option>
                            <option value="OFF">OFF</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">วันที่ต้องการลา</label>
                        <input type="date" id="leave-date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition duration-200">
                        ยืนยันการจอง
                    </button>
                </form>
            </div>

            <!-- Calendar Container -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 md:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center">
                        <i class="fa-solid fa-calendar text-indigo-600 mr-2"></i>ปฏิทินการจองวันลา
                    </h2>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <span id="month-year-display" class="text-sm font-bold text-slate-700 w-32 text-center"></span>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Weekdays -->
                <div class="grid grid-cols-7 text-center font-semibold text-slate-500 mb-2 text-xs">
                    <div class="text-red-500">อา</div>
                    <div>จ</div>
                    <div>อ</div>
                    <div>พ</div>
                    <div>พฤ</div>
                    <div>ศ</div>
                    <div class="text-blue-500">ส</div>
                </div>

                <!-- Calendar Days -->
                <div id="calendar-days" class="grid grid-cols-7 gap-1.5"></div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPnmCiI3kiMPn69piQGIXo4-LU6fBsNzT3PI6H5TWpOqoLP9SK-Of2mf6a1BXKuSJU/exec";

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let allBookings = [];
        const monthsName = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

        function checkPassword(event) {
            event.preventDefault();
            const pass = document.getElementById('passcode-input').value;
            if (pass === '1234') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                document.body.classList.remove('flex', 'items-center', 'justify-center');
                loadBookings();
            } else {
                Swal.fire({ icon: 'error', title: 'รหัสผ่านไม่ถูกต้อง', text: 'กรุณากรอกใหม่อีกครั้ง', confirmButtonColor: '#4f46e5' });
                document.getElementById('passcode-input').value = '';
            }
        }

        async function loadBookings() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                allBookings = data.bookings || [];
                renderCalendar();
            } catch (error) {
                console.error("Error loading bookings:", error);
            }
        }

        async function handleBooking(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = 'กำลังบันทึก...';
            submitBtn.disabled = true;

            const payload = {
                empId: document.getElementById('emp-id').value,
                name: document.getElementById('emp-name').value,
                shift: document.getElementById('emp-shift').value,
                leaveDate: document.getElementById('leave-date').value
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.success) {
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: 'ข้อมูลการจองถูกบันทึกเรียบร้อยแล้ว', confirmButtonColor: '#4f46e5' });
                    document.getElementById('booking-form').reset();
                    loadBookings();
                } else {
                    Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: result.message, confirmButtonColor: '#4f46e5' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อเพื่อบันทึกข้อมูลได้', confirmButtonColor: '#4f46e5' });
            } finally {
                submitBtn.innerText = 'ยืนยันการจอง';
                submitBtn.disabled = false;
            }
        }

        function renderCalendar() {
            const calendarDays = document.getElementById('calendar-days');
            const monthYearDisplay = document.getElementById('month-year-display');
            calendarDays.innerHTML = '';

            monthYearDisplay.innerText = `${monthsName[currentMonth]} ${currentYear + 543}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // ช่องว่างต้นเดือน
            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'h-28 bg-slate-50 border border-slate-100 rounded-lg';
                calendarDays.appendChild(emptyDiv);
            }

            // วันในเดือน
            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'h-28 border border-slate-200 rounded-lg p-1 bg-white flex flex-col justify-between overflow-hidden shadow-sm';
                
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayBookings = allBookings.filter(b => b.leaveDate === dateStr);

                let bookingsHtml = '';
                dayBookings.forEach(b => {
                    let shiftClass = "bg-amber-100 text-amber-800 border-amber-200";
                    const shiftLower = (b.shift || '').toLowerCase();
                    
                    if (shiftLower.includes('เช้า') || shiftLower.includes('morning')) {
                        shiftClass = "bg-emerald-100 text-emerald-800 border-emerald-200"; // กะเช้า = สีเขียว
                    } else if (shiftLower.includes('บ่าย') || shiftLower.includes('evening')) {
                        shiftClass = "bg-blue-100 text-blue-800 border-blue-200"; // กะบ่าย = สีฟ้า
                    } else if (shiftLower.includes('ดึก') || shiftLower.includes('night')) {
                        shiftClass = "bg-purple-100 text-purple-800 border-purple-200"; // กะดึก = สีม่วง
                    } else if (shiftLower.includes('off')) {
                        shiftClass = "bg-rose-100 text-rose-800 border-rose-200"; // OFF = สีแดง
                    }

                    bookingsHtml += `<div class="text-[10px] ${shiftClass} px-1 py-0.5 rounded truncate border mt-0.5 font-medium" title="${b.name} (${b.shift})">
                        ${b.name} (${b.shift})
                    </div>`;
                });

                dayDiv.innerHTML = `
                    <div class="font-bold text-xs text-slate-700 px-1">${day}</div>
                    <div class="overflow-y-auto flex-1 space-y-0.5">${bookingsHtml}</div>
                `;
                calendarDays.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }
    </script>
</body>
</html>
