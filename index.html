<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XB-C1 Vac booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-purple-950 min-h-screen text-slate-800 flex items-center justify-center p-4">

    <!-- Password Modal / Lock Screen -->
    <div id="lock-screen" class="fixed inset-0 bg-purple-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center space-y-6 border border-purple-100">
            <div class="w-16 h-16 bg-purple-100 text-purple-800 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-purple-900 tracking-wide">XB-C1 Vac booking</h2>
                <p class="text-xs text-slate-500 mt-1">Please enter passcode to access</p>
            </div>
            <form onsubmit="checkPassword(event)" class="space-y-4">
                <input type="password" id="passcode-input" required maxlength="4" class="w-full text-center tracking-widest text-2xl px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-700 focus:outline-none" placeholder="••••">
                <button type="submit" class="w-full bg-purple-800 hover:bg-purple-900 text-white font-medium py-3 rounded-xl text-sm shadow-lg transition duration-200">
                    Login
                </button>
            </form>
            <div class="pt-2 border-t border-slate-100 text-[11px] font-semibold text-purple-900 tracking-wider">
                Prepare by XB-C1 OFFICE
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="main-app" class="container mx-auto p-4 max-w-6xl space-y-6 hidden w-full">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center border border-slate-200 gap-4">
            <div>
                <h1 class="text-xl font-bold text-purple-900 flex items-center">
                    <i class="fa-solid fa-calendar-check text-purple-700 mr-2"></i> XB-C1 Vac booking
                </h1>
                <p class="text-xs text-slate-500 mt-1">Manage and check leave quota (Morning / Evening shifts limited to 3 persons/day)</p>
            </div>
            <button onclick="loadBookings()" class="bg-purple-50 hover:bg-purple-100 text-purple-800 px-4 py-2 rounded-lg text-sm font-medium transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Booking Form -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 h-fit">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
                    <i class="fa-solid fa-calendar-plus text-purple-700 mr-2"></i>Booking Form
                </h2>
                <form id="booking-form" onsubmit="handleBooking(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Employee ID</label>
                        <input type="text" id="emp-id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-700 focus:outline-none" placeholder="e.g. 12345">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Name</label>
                        <input type="text" id="emp-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-700 focus:outline-none" placeholder="A ชาญ">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Shift</label>
                        <select id="emp-shift" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-700 focus:outline-none bg-white">
                            <option value="">-- Select Shift --</option>
                            <option value="กะเช้า">กะเช้า</option>
                            <option value="กะเย็น">กะเย็น</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Leave Date</label>
                        <input type="date" id="leave-date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-700 focus:outline-none">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-purple-800 hover:bg-purple-900 text-white font-medium py-2.5 rounded-lg text-sm shadow transition duration-200">
                        Confirm Booking
                    </button>
                </form>
            </div>

            <!-- Calendar Container -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 md:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center">
                        <i class="fa-solid fa-calendar text-purple-700 mr-2"></i>Leave Calendar
                    </h2>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <span id="month-year-display" class="text-sm font-bold text-slate-700 w-40 text-center"></span>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Weekdays -->
                <div class="grid grid-cols-7 text-center font-semibold text-slate-500 mb-2 text-xs">
                    <div class="text-red-500">Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div class="text-blue-500">Sat</div>
                </div>

                <!-- Calendar Days -->
                <div id="calendar-days" class="grid grid-cols-7 gap-1.5 items-start"></div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPnmCiI3kiMPn69piQGIXo4-LU6fBsNzT3PI6H5TWpOqoLP9SK-Of2mf6a1BXKuSJU/exec";

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let allBookings = [];
        const monthsName = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function checkPassword(event) {
            if (event) event.preventDefault();
            const pass = document.getElementById('passcode-input').value;
            if (pass === '1234') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                document.body.classList.remove('bg-purple-950', 'flex', 'items-center', 'justify-center');
                document.body.classList.add('bg-slate-100');
                loadBookings();
            } else {
                Swal.fire({ icon: 'error', title: 'Incorrect Passcode', text: 'Please try again', confirmButtonColor: '#6b21a8' });
                document.getElementById('passcode-input').value = '';
            }
        }

        async function loadBookings() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                allBookings = data.bookings || [];
                renderCalendar();
            } catch (error) {
                console.error("Error loading bookings:", error);
            }
        }

        async function handleBooking(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = 'Saving...';
            submitBtn.disabled = true;

            const payload = {
                empId: document.getElementById('emp-id').value,
                name: document.getElementById('emp-name').value,
                shift: document.getElementById('emp-shift').value,
                leaveDate: document.getElementById('leave-date').value
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.success) {
                    Swal.fire({ icon: 'success', title: 'Success', text: 'Leave booking saved successfully', confirmButtonColor: '#6b21a8' });
                    document.getElementById('booking-form').reset();
                    loadBookings();
                } else {
                    Swal.fire({ icon: 'error', title: 'Booking Failed', text: result.message, confirmButtonColor: '#6b21a8' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Could not connect to server', confirmButtonColor: '#6b21a8' });
            } finally {
                submitBtn.innerText = 'Confirm Booking';
                submitBtn.disabled = false;
            }
        }

        // ฟังก์ชันสำหรับกดยกเลิกวันลา
        async function cancelBookingPrompt(dateStr, empName, shiftName) {
            const { value: empIdInput } = await Swal.fire({
                title: 'ยืนยันการยกเลิกวันลา',
                text: `ต้องการยกเลิกวันลาของ "${empName}" (${shiftName}) วันที่ ${dateStr} ใช่หรือไม่? กรุณากรอกรหัสพนักงานของคุณเพื่อยืนยัน`,
                input: 'password',
                inputPlaceholder: 'Enter Employee ID',
                inputAttributes: {
                    autocapitalize: 'off',
                    autocorrect: 'off'
                },
                showCancelButton: true,
                confirmButtonText: 'ยืนยันยกเลิก',
                cancelButtonText: 'ปิด',
                confirmButtonColor: '#dc2626'
            });

            if (empIdInput) {
                Swal.fire({ title: 'Cancelling...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'delete',
                            empId: empIdInput,
                            leaveDate: dateStr
                        })
                    });
                    const result = await response.json();

                    if (result.success) {
                        Swal.fire({ icon: 'success', title: 'Cancelled', text: 'ยกเลิกวันลาเรียบร้อยแล้ว', confirmButtonColor: '#6b21a8' });
                        loadBookings();
                    } else {
                        Swal.fire({ icon: 'error', title: 'Failed', text: result.message, confirmButtonColor: '#6b21a8' });
                    }
                } catch (error) {
                    Swal.fire({ icon: 'error', title: 'Error', text: 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', confirmButtonColor: '#6b21a8' });
                }
            }
        }

        function getShiftPriority(shift) {
            const s = (shift || '').toString().toLowerCase().trim();
            if (s.includes('เช้า')) return 1;
            if (s.includes('เย็น') || s.includes('บ่าย') || s.includes('evening')) return 2;
            return 3;
        }

        function renderCalendar() {
            const calendarDays = document.getElementById('calendar-days');
            const monthYearDisplay = document.getElementById('month-year-display');
            calendarDays.innerHTML = '';

            monthYearDisplay.innerText = `${monthsName[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'min-h-[110px] bg-slate-50 border border-slate-100 rounded-lg';
                calendarDays.appendChild(emptyDiv);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[110px] h-auto border border-slate-200 rounded-lg p-1 bg-white flex flex-col justify-start shadow-sm';
                
                const formattedMonth = String(currentMonth + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${formattedMonth}-${formattedDay}`;

                let dayBookings = allBookings.filter(b => {
                    if (!b.leaveDate) return false;
                    return b.leaveDate.startsWith(dateStr);
                });

                dayBookings.sort((a, b) => getShiftPriority(a.shift) - getShiftPriority(b.shift));

                let bookingsHtml = '';
                dayBookings.forEach(b => {
                    let shiftClass = "bg-yellow-100 text-yellow-800 border-yellow-200";
                    const priority = getShiftPriority(b.shift);
                    
                    if (priority === 1) {
                        shiftClass = "bg-yellow-100 text-yellow-800 border-yellow-200"; // กะเช้า = สีเหลืองพาสเทล
                    } else if (priority === 2) {
                        shiftClass = "bg-blue-100 text-blue-800 border-blue-200"; // กะเย็น = สีฟ้า
                    }

                    // แสดงชื่อพนักงาน พร้อมปุ่มกากบาทเล็กๆ (x) สำหรับคลิกยกเลิก
                    bookingsHtml += `
                        <div class="text-[11px] ${shiftClass} px-1.5 py-0.5 rounded border mt-0.5 font-medium flex justify-between items-center group" title="${b.name} (${b.shift})">
                            <span class="truncate pr-1">${b.name}</span>
                            <button onclick="cancelBookingPrompt('${dateStr}', '${b.name}', '${b.shift}')" class="text-slate-400 hover:text-red-600 font-bold px-1 rounded transition" title="Cancel this leave">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>`;
                });

                dayDiv.innerHTML = `
                    <div class="font-bold text-xs text-slate-700 px-0.5 mb-1">${day}</div>
                    <div class="w-full flex-1 space-y-0.5">${bookingsHtml}</div>
                `;
                calendarDays.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }
    </script>
</body>
</html>
