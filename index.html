<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XB-C1 Vac booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-purple-950 min-h-screen text-slate-800 flex items-center justify-center p-4">

    <!-- Login Modal / Lock Screen -->
    <div id="lock-screen" class="fixed inset-0 bg-purple-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center space-y-6 border border-purple-100">
            <div class="w-16 h-16 bg-purple-100 text-purple-800 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-purple-900 tracking-wide">XB-C1 Vac booking</h2>
                <p class="text-xs text-slate-500 mt-1">Please enter your Employee ID to access</p>
            </div>
            <form onsubmit="checkEmployeeLogin(event)" class="space-y-4">
                <input type="text" id="login-emp-id" required class="w-full text-center tracking-widest text-lg px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-purple-700 focus:outline-none uppercase" placeholder="Enter Employee ID">
                <button type="submit" id="login-btn" class="w-full bg-purple-800 hover:bg-purple-900 text-white font-medium py-3 rounded-xl text-sm shadow-lg transition duration-200">
                    Login
                </button>
            </form>
            <div class="pt-2 border-t border-slate-100 text-[11px] font-semibold text-purple-900 tracking-wider">
                Prepare by XB-C1 OFFICE
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="main-app" class="container mx-auto p-4 max-w-6xl space-y-6 hidden w-full">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center border border-slate-200 gap-4">
            <div>
                <h1 class="text-xl font-bold text-purple-900 flex items-center">
                    <i class="fa-solid fa-calendar-check text-purple-700 mr-2"></i> XB-C1 Vac booking
                </h1>
                <p class="text-xs text-slate-500 mt-1">Logged in as: <span id="current-user-display" class="font-bold text-purple-700"></span></p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="loadBookings()" class="bg-purple-50 hover:bg-purple-100 text-purple-800 px-4 py-2 rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Data
                </button>
                <button onclick="lockApp()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-2 rounded-lg text-sm font-medium transition" title="Lock App Now">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Booking Form -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 h-fit">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
                    <i class="fa-solid fa-calendar-plus text-purple-700 mr-2"></i>Booking Form
                </h2>
                <form id="booking-form" onsubmit="handleBooking(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Employee ID</label>
                        <input type="text" id="emp-id" readonly class="w-full px-3 py-2 border border-slate-200 bg-slate-100 rounded-lg text-sm text-slate-500 cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Name</label>
                        <input type="text" id="emp-name" readonly class="w-full px-3 py-2 border border-slate-200 bg-slate-100 rounded-lg text-sm text-slate-500 cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Shift</label>
                        <select id="emp-shift" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-700 focus:outline-none bg-white">
                            <option value="">-- Select Shift --</option>
                            <option value="กะเช้า">กะเช้า</option>
                            <option value="กะเย็น">กะเย็น</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Leave Date</label>
                        <input type="date" id="leave-date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-700 focus:outline-none">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-purple-800 hover:bg-purple-900 text-white font-medium py-2.5 rounded-lg text-sm shadow transition duration-200">
                        Confirm Booking
                    </button>
                </form>
            </div>

            <!-- Calendar Container -->
            <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-200 md:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center">
                        <i class="fa-solid fa-calendar text-purple-700 mr-2"></i>Leave Calendar
                    </h2>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <span id="month-year-display" class="text-sm font-bold text-slate-700 w-40 text-center"></span>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Weekdays -->
                <div class="grid grid-cols-7 text-center font-semibold text-slate-500 mb-2 text-xs">
                    <div class="text-red-500">Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div class="text-blue-500">Sat</div>
                </div>

                <!-- Calendar Days -->
                <div id="calendar-days" class="grid grid-cols-7 gap-1.5 items-start"></div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPnmCiI3kiMPn69piQGIXo4-LU6fBsNzT3PI6H5TWpOqoLP9SK-Of2mf6a1BXKuSJU/exec";

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let allBookings = [];
        let idleTimer = null;
        let loggedInEmpId = "";
        let loggedInEmpName = "";
        const IDLE_TIMEOUT = 2 * 60 * 1000;
        const monthsName = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        async function checkEmployeeLogin(event) {
            if (event) event.preventDefault();
            const empIdInput = document.getElementById('login-emp-id');
            const empId = empIdInput ? empIdInput.value.trim() : '';
            const loginBtn = document.getElementById('login-btn');

            if (!empId) return;

            loginBtn.innerText = 'Checking...';
            loginBtn.disabled = true;

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', empId: empId })
                });
                const result = await response.json();

                if (result.success) {
                    loggedInEmpId = empId;
                    loggedInEmpName = result.name;

                    document.getElementById('emp-id').value = loggedInEmpId;
                    document.getElementById('emp-name').value = loggedInEmpName;
                    document.getElementById('current-user-display').innerText = `${loggedInEmpName} (${loggedInEmpId})`;

                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    document.body.classList.remove('bg-purple-950', 'flex', 'items-center', 'justify-center');
                    document.body.classList.add('bg-slate-100');

                    empIdInput.value = '';
                    loadBookings();
                    resetIdleTimer();
                } else {
                    Swal.fire({ icon: 'error', title: 'Login Failed', text: result.message, confirmButtonColor: '#6b21a8' });
                    empIdInput.value = '';
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Connection Error', text: 'ไม่สามารถตรวจสอบรหัสพนักงานได้', confirmButtonColor: '#6b21a8' });
            } finally {
                loginBtn.innerText = 'Login';
                loginBtn.disabled = false;
            }
        }

        function lockApp() {
            loggedInEmpId = "";
            loggedInEmpName = "";
            document.getElementById('lock-screen').style.display = 'flex';
            document.getElementById('main-app').classList.add('hidden');
            document.body.classList.add('bg-purple-950', 'flex', 'items-center', 'justify-center');
            document.body.classList.remove('bg-slate-100');
            
            const empIdInput = document.getElementById('login-emp-id');
            if (empIdInput) empIdInput.value = '';
            clearTimeout(idleTimer);
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            const mainApp = document.getElementById('main-app');
            if (mainApp && !mainApp.classList.contains('hidden')) {
                idleTimer = setTimeout(() => {
                    lockApp();
                }, IDLE_TIMEOUT);
            }
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('keypress', resetIdleTimer);
        window.addEventListener('click', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                lockApp();
            }
        });

        async function loadBookings() {
            resetIdleTimer();
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                allBookings = data.bookings || [];
                renderCalendar();
            } catch (error) {
                console.error("Error loading bookings:", error);
            }
        }

        async function handleBooking(event) {
            event.preventDefault();
            resetIdleTimer();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = 'Saving...';
            submitBtn.disabled = true;

            const payload = {
                empId: loggedInEmpId,
                name: loggedInEmpName,
                shift: document.getElementById('emp-shift').value,
                leaveDate: document.getElementById('leave-date').value
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.success) {
                    Swal.fire({ icon: 'success', title: 'Success', text: 'Leave booking saved successfully', confirmButtonColor: '#6b21a8' });
                    document.getElementById('emp-shift').value = '';
                    document.getElementById('leave-date').value = '';
                    loadBookings();
                } else {
                    Swal.fire({ icon: 'error', title: 'Booking Failed', text: result.message, confirmButtonColor: '#6b21a8' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Could not connect to server', confirmButtonColor: '#6b21a8' });
            } finally {
                submitBtn.innerText = 'Confirm Booking';
                submitBtn.disabled = false;
            }
        }

        function showDayDetails(dateStr, dayNumber) {
            resetIdleTimer();
            let dayBookings = allBookings.filter(b => {
                if (!b.leaveDate) return false;
                return b.leaveDate.startsWith(dateStr);
            });

            dayBookings.sort((a, b) => getShiftPriority(a.shift) - getShiftPriority(b.shift));

            // แปลงรูปแบบวันที่ให้แสดงเป็น DD Month YYYY (เช่น 07 November 2026)
            const parts = dateStr.split('-');
            const fYear = parts[0];
            const fMonthIdx = parseInt(parts[1], 10) - 1;
            const fDay = parts[2];
            const formattedDateTitle = `${fDay} ${monthsName[fMonthIdx]} ${fYear}`;

            let htmlContent = `<div class="space-y-2 text-left max-h-60 overflow-y-auto pr-1">`;
            
            if (dayBookings.length === 0) {
                htmlContent += `<p class="text-sm text-slate-500 text-center py-4">ไม่มีรายการลาในวันนี้</p>`;
            } else {
                dayBookings.forEach(b => {
                    let badgeClass = "bg-yellow-100 text-yellow-800 border-yellow-200";
                    if (getShiftPriority(b.shift) === 2) {
                        badgeClass = "bg-blue-100 text-blue-800 border-blue-200";
                    }

                    let canCancel = (b.empId === loggedInEmpId);
                    
                    htmlContent += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl border ${badgeClass} text-xs font-medium">
                            <div>
                                <span class="font-bold text-sm">${b.name}</span> 
                                <span class="opacity-75">(${b.shift})</span>
                            </div>
                            ${canCancel ? `<button onclick="cancelFromPopup('${dateStr}', '${b.empId}', '${b.name}', '${b.shift}')" class="bg-white/80 hover:bg-red-600 hover:text-white text-red-600 px-2 py-1 rounded-lg font-bold transition shadow-sm" title="ยกเลิกวันลานี้">
                                <i class="fa-solid fa-trash-can mr-1"></i> ยกเลิก
                            </button>` : `<span class="text-[10px] opacity-60">ID: ${b.empId}</span>`}
                        </div>`;
                });
            }
            htmlContent += `</div>`;

            Swal.fire({
                title: `รายชื่อผู้ลาวันที่ ${formattedDateTitle}`,
                html: htmlContent,
                showCloseButton: true,
                showConfirmButton: false,
                confirmButtonColor: '#6b21a8'
            });
        }

        async function cancelFromPopup(dateStr, bookingEmpId, empName, shiftName) {
            Swal.close();
            resetIdleTimer();

            const confirmResult = await Swal.fire({
                title: 'ยืนยันการยกเลิกวันลา',
                text: `ต้องการยกเลิกวันลาของ "${empName}" (${shiftName}) วันที่ ${dateStr} ใช่หรือไม่?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันยกเลิก',
                cancelButtonText: 'ปิด',
                confirmButtonColor: '#dc2626'
            });

            if (confirmResult.isConfirmed) {
                Swal.fire({ title: 'Cancelling...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'delete',
                            empId: loggedInEmpId,
                            leaveDate: dateStr
                        })
                    });
                    const result = await response.json();

                    if (result.success) {
                        Swal.fire({ icon: 'success', title: 'Cancelled', text: 'ยกเลิกวันลาเรียบร้อยแล้ว', confirmButtonColor: '#6b21a8' });
                        loadBookings();
                    } else {
                        Swal.fire({ icon: 'error', title: 'Failed', text: result.message, confirmButtonColor: '#6b21a8' });
                    }
                } catch (error) {
                    Swal.fire({ icon: 'error', title: 'Error', text: 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', confirmButtonColor: '#6b21a8' });
                }
            }
        }

        function getShiftPriority(shift) {
            const s = (shift || '').toString().toLowerCase().trim();
            if (s.includes('เช้า')) return 1;
            if (s.includes('เย็น') || s.includes('บ่าย') || s.includes('evening')) return 2;
            return 3;
        }

        function renderCalendar() {
            const calendarDays = document.getElementById('calendar-days');
            const monthYearDisplay = document.getElementById('month-year-display');
            if (!calendarDays || !monthYearDisplay) return;
            
            calendarDays.innerHTML = '';
            monthYearDisplay.innerText = `${monthsName[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'min-h-[110px] bg-slate-50 border border-slate-100 rounded-lg';
                calendarDays.appendChild(emptyDiv);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'min-h-[110px] h-auto border border-slate-200 rounded-lg p-1.5 bg-white flex flex-col justify-start shadow-sm hover:border-purple-400 hover:shadow-md transition cursor-pointer';
                
                const formattedMonth = String(currentMonth + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${formattedMonth}-${formattedDay}`;

                dayDiv.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    showDayDetails(dateStr, day);
                };

                let dayBookings = allBookings.filter(b => {
                    if (!b.leaveDate) return false;
                    return b.leaveDate.startsWith(dateStr);
                });

                dayBookings.sort((a, b) => getShiftPriority(a.shift) - getShiftPriority(b.shift));

                let bookingsHtml = '';
                dayBookings.forEach(b => {
                    let shiftClass = "bg-yellow-100 text-yellow-800 border-yellow-200";
                    const priority = getShiftPriority(b.shift);
                    
                    if (priority === 1) {
                        shiftClass = "bg-yellow-100 text-yellow-800 border-yellow-200";
                    } else if (priority === 2) {
                        shiftClass = "bg-blue-100 text-blue-800 border-blue-200";
                    }

                    bookingsHtml += `
                        <div class="text-[11px] ${shiftClass} px-1.5 py-1 rounded border mb-1 font-medium flex justify-between items-center" title="${b.name} (${b.shift})">
                            <span class="truncate font-semibold">${b.name}</span>
                            <span class="text-[10px] opacity-75 ml-1">(${b.shift === 'กะเช้า' ? 'เช้า' : 'เย็น'})</span>
                        </div>`;
                });

                dayDiv.innerHTML = `
                    <div class="flex justify-between items-center px-0.5 mb-1">
                        <span class="font-bold text-xs text-slate-700">${day}</span>
                        ${dayBookings.length > 0 ? `<span class="bg-purple-100 text-purple-800 text-[10px] px-1.5 rounded-full font-bold">${dayBookings.length} คน</span>` : ''}
                    </div>
                    <div class="w-full flex-1 space-y-0.5">${bookingsHtml}</div>
                `;
                calendarDays.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            resetIdleTimer();
            currentMonth += direction;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }
    </script>
</body>
</html>
